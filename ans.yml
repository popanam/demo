---
- name: Базовая настройка серверов и маршрутизаторов

  # Указываем целевые хосты через запятую
  hosts: "HQ-SRV,BR-SRV,BR-RTR,HQ-RTR"

  become: yes # Обязательно, так как установка пакетов требует прав root

  tasks:
    - name: Установка базового набора пакетов
      apt:
        name:
          - bash-completion
          - vim-console
          - chrony
          - wget
          - curl
          - tzdata
          - apt-repo
        state: present
        update_cache: yes # Обновление кэша apt перед установкой