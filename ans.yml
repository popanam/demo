---
- name: Install the base packages
  hosts:
    - HQ-SRV
    - BR-SRV
    - BR-RTR
    - HQ-RTR
  become: true

  tasks:
    - name: Install base packages
      community.general.apt_rpm:
        name: "{{ item }}"
        state: present
        update_cache: true
      loop:
        - bash-completion
        - vim-console
        - chrony
        - wget
        - curl
        - tzdata
        - apt-repo